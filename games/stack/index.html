<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Blokkentoren</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    #cv { width: 100%; height: 100%; cursor: pointer; }
  </style>
</head>
<body>

  <div class="g-wrap">
    <div class="g-bar">
      <span><i class="g-score-label"></i> <b class="g-score-val">0</b></span>
      <span class="g-extra"></span>
      <span><i class="g-best-label"></i> <b class="g-best-val">0</b></span>
    </div>

    <div class="g-stage"><canvas id="cv"></canvas></div>

    <div class="g-over hidden">
      <div class="g-over-card">
        <div class="g-over-emoji">🧱</div>
        <b class="g-over-title"></b>
        <p class="g-over-score"></p>
        <button class="g-again"></button>
      </div>
    </div>
  </div>

  <script src="../common.js"></script>
  <script>
    /* Blokkentoren — a block slides back and forth, tap to drop it. What hangs
       over the edge is cut off, so every sloppy drop makes the next one harder.
       Miss the tower completely and the round is over. */
    const cv = document.getElementById("cv");
    const BH = 26;                       // block height in css pixels

    let ctx = null, W = 0, H = 0;
    let blocks = [], cur = null, dir = 1, speed = 1.7, score = 0;
    let running = false, raf = null;

    function refit() {
      const f = G.fit(cv);
      ctx = f.ctx; W = f.w; H = f.h;
    }

    function spawn() {
      const prev = blocks[blocks.length - 1];
      dir = Math.random() < 0.5 ? 1 : -1;
      cur = { x: dir > 0 ? 0 : W - prev.w, w: prev.w };
    }

    function reset() {
      refit();
      const w0 = Math.min(150, W * 0.45);
      blocks = [{ x: W / 2 - w0 / 2, w: w0 }];
      score = 0; speed = 1.7;
      G.score(0);
      G.extra("");
      spawn();
      running = true;
      cancelAnimationFrame(raf);
      loop();
    }

    function place() {
      if (!running) return;
      const prev = blocks[blocks.length - 1];
      const left = Math.max(cur.x, prev.x);
      const right = Math.min(cur.x + cur.w, prev.x + prev.w);
      const overlap = right - left;

      if (overlap <= 2) {
        running = false;
        cancelAnimationFrame(raf);
        draw();
        G.over(score);
        return;
      }

      blocks.push({ x: left, w: overlap });
      score++;
      G.score(score);
      G.record(score);
      speed = Math.min(6.5, speed + 0.13);
      spawn();
    }

    function drawBlock(x, y, w, i) {
      ctx.fillStyle = `hsl(${(i * 16 + 205) % 360} 68% 58%)`;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, BH - 3, 5);
      else ctx.rect(x, y, w, BH - 3);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      const baseY = H - 8;
      const off = Math.max(0, (blocks.length + 1) * BH - H * 0.72);
      blocks.forEach((b, i) => drawBlock(b.x, baseY - (i + 1) * BH + off, b.w, i));
      if (running && cur) {
        drawBlock(cur.x, baseY - (blocks.length + 1) * BH + off, cur.w, blocks.length);
      }
    }

    function loop() {
      if (running) {
        cur.x += dir * speed;
        if (cur.x + cur.w >= W) { cur.x = W - cur.w; dir = -1; }
        else if (cur.x <= 0) { cur.x = 0; dir = 1; }
      }
      draw();
      raf = requestAnimationFrame(loop);
    }

    cv.addEventListener("pointerdown", place);
    window.addEventListener("keydown", e => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); place(); }
    });
    window.addEventListener("resize", () => { refit(); draw(); });

    G.init({ id: "stack", onRestart: reset });
    reset();
  </script>
</body>
</html>
