<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oefensommen</title>
  <link rel="stylesheet" href="css/style.css?v=202610271653">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
</head>
<body>

  <header class="topbar">
    <button id="btn-brand" class="brand" title="Oefensommen" aria-label="Oefensommen">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <path d="M7.5 9.5h9M7.5 14.5h9M12 7v3M9.5 12v5"/>
      </svg>
    </button>
    <div class="topbar-right">
      <div id="timerbox" class="timerbox hidden">
        <span class="timer-clock">⏱</span>
        <span id="timer" class="timer-value">0:00</span>
        <button id="btn-pause" class="timer-btn" data-i18n-title="pause">⏸</button>
        <button id="btn-skip" class="timer-btn" data-i18n-title="skip">⏭</button>
      </div>
      <div id="langpick" class="langpick">
        <button id="lang-current" class="flag-btn" aria-haspopup="true" aria-expanded="false">
          <span id="lang-flag">🇳🇱</span><span id="lang-caret" class="caret hidden">▾</span>
        </button>
        <div id="lang-menu" class="lang-menu hidden">
          <button class="lang-opt" data-lang="nl">🇳🇱 Nederlands</button>
          <button class="lang-opt" data-lang="en">🇬🇧 English</button>
          <button class="lang-opt" data-lang="tr">🇹🇷 Türkçe</button>
        </div>
      </div>
      <button id="btn-logout-top" class="icon-btn hidden" data-i18n-title="logout" aria-label="Uitloggen">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 17l5-5-5-5"></path>
          <path d="M20 12H9"></path>
          <path d="M13 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h7"></path>
        </svg>
      </button>
    </div>
  </header>

  <main id="app">

    <!-- LOGIN -->
    <section id="screen-login" class="screen">
      <div class="login-wrap">
        <h1 class="welkom"><span data-i18n="welkom">Welkom</span><span id="welkom-name" class="name"></span> 👋</h1>
        <p id="login-sub" class="login-sub" data-i18n="login_hint">Typ het wachtwoord om de deur te openen</p>

        <input type="text" id="login-user" class="hidden" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false"
               data-i18n-ph="username" placeholder="Naam">
        <input type="password" id="login-pass" inputmode="numeric" autocomplete="current-password" data-i18n-ph="password" placeholder="Wachtwoord">
        <p id="login-error" class="error hidden" data-i18n="login_err">Dat klopt niet. Probeer het nog eens!</p>
        <button id="btn-login" class="btn primary big" data-i18n="login_btn">Open de deur</button>
      </div>
    </section>

    <!-- HOME -->
    <section id="screen-home" class="screen hidden screen--fit">
      <div class="card home-card">
        <div class="home-head">
          <h1 id="home-greeting">Hoi!</h1>
          <p id="home-chips" class="home-chips"></p>
        </div>
        <p id="home-status" class="status"></p>
        <div class="home-doors">
          <button id="btn-sprint" class="door-tile hidden">
            <span class="door-icon">⚡</span>
            <span id="sprint-label" class="door-name">Tafels</span>
            <b id="sprint-done" class="door-badge"></b>
          </button>
          <button id="btn-start" class="door-tile">
            <span class="door-icon">🧮</span>
            <span id="start-label" class="door-name">Redactiesommen</span>
            <b id="start-done" class="door-badge"></b>
          </button>
          <button id="btn-klok" class="door-tile">
            <span class="door-icon">🕐</span>
            <span id="klok-label" class="door-name">Klokkijken</span>
            <b id="klok-done" class="door-badge"></b>
          </button>
        </div>
        <button id="btn-report" class="btn ghost big hidden">📋 <span data-i18n="report_btn">Rapport</span></button>
        <button id="btn-watch" class="btn primary big hidden">🔴 <span data-i18n="watch_live">Live meekijken</span></button>
      </div>
    </section>

    <!-- TASK -->
    <section id="screen-task" class="screen hidden screen--fit">
      <div class="card">
        <div class="task-head">
          <button id="btn-quit" class="icon-ghost" aria-label="Terug">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6"></path>
            </svg>
          </button>
          <div class="progress-wrap"><div id="progress-bar" class="progress-bar"></div></div>
          <span id="progress-text" class="progress-text">1/20</span>
        </div>
        <div class="task-split">
          <div class="task-main">
            <div class="task-question-col">
              <div id="question-clock" class="question-clock hidden"></div>
              <div class="question-row">
                <p id="question-text" class="question"></p>
                <img id="school-badge" class="school-badge hidden" alt="school"
                     title="Zo'n som krijg je ook op school" src="img/school.svg">
              </div>
              <div class="task-tools">
                <button id="btn-hint" class="hint-btn hidden" aria-label="Hint">💡<b id="hint-count" class="hint-count"></b></button>
              </div>
              <p id="hint-bubble" class="hint-bubble hidden"></p>
            </div>
            <div class="task-answer-col">
              <div id="answers" class="answers"></div>
              <div id="explain-box" class="explain-box hidden">
                <div id="explain-body"></div>
                <button id="btn-gotit" class="btn primary hidden">Begrepen!</button>
              </div>
            </div>
          </div>
          <aside id="task-marks" class="marks-panel"></aside>
        </div>
      </div>
    </section>

    <!-- TAFELSPRINT: ten tafels against the clock, two answers -->
    <section id="screen-sprint" class="screen hidden screen--fit">
      <div class="card sprint-card">
        <header class="sprint-head">
          <button id="sprint-quit" class="icon-ghost" data-i18n-title="back_home" aria-label="Terug">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6"></path>
            </svg>
          </button>
          <button id="sprint-pause" class="icon-ghost" data-i18n-title="pause" aria-label="Pauze">
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <rect x="3" y="2.5" width="3.5" height="11" rx="1.2" fill="currentColor"/>
              <rect x="9.5" y="2.5" width="3.5" height="11" rx="1.2" fill="currentColor"/>
            </svg>
          </button>
          <h2 id="sprint-badge-label" class="sprint-title">Tafelsprint</h2>
          <span id="sprint-sep" class="sprint-sep" aria-hidden="true">·</span>
          <span id="sprint-count" class="sprint-secs">20</span>
          <span id="sprint-unit" class="sprint-unit" aria-hidden="true">s</span>
          <span id="sprint-progress" class="sprint-step">1 / 10</span>
        </header>
        <div class="sprint-track"><div id="sprint-bar" class="sprint-fill"></div></div>

        <div class="sprint-body">
          <div class="sprint-main">
            <p id="sprint-question" class="sprint-q">6 × 8</p>
            <div id="sprint-answers" class="sprint-answers"></div>
            <p id="sprint-flash" class="sprint-flash"></p>
          </div>
          <aside id="sprint-marks" class="marks-panel"></aside>
        </div>

        <div id="sprint-paused" class="sprint-paused hidden">
          <span class="paused-mark" aria-hidden="true">⏸</span>
          <span class="paused-text" data-i18n="paused_sub">De klok staat stil.</span>
          <button id="sprint-resume" class="btn primary" aria-label="Verder gaan">▶</button>
        </div>
      </div>
    </section>

    <!-- RAPPORT: today and every day before it, in one place -->
    <section id="screen-result" class="screen hidden">
      <div class="card report-card">
        <header class="report-head">
          <button id="report-back" class="icon-ghost" data-i18n-title="back_home" aria-label="Terug">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 5l-7 7 7 7"/>
            </svg>
          </button>
          <h2 class="report-title"><span data-i18n="report_btn">Rapport</span></h2>
        </header>
        <div id="report-strip" class="report-strip"></div>
        <div id="report-day" class="report-day"></div>
      </div>
    </section>

    <!-- COUNTDOWN -->
    <section id="screen-count" class="screen hidden screen--fit">
      <div class="count-stage">
        <svg class="count-ring" viewBox="0 0 120 120">
          <circle class="count-track" cx="60" cy="60" r="52"></circle>
          <circle id="count-progress" class="count-arc" cx="60" cy="60" r="52"></circle>
        </svg>
        <div id="count-number" class="count-number">3</div>
      </div>
      <p id="count-label" class="count-label" data-i18n="get_ready">Klaar voor de start…</p>
    </section>

    <!-- PAUSE -->
    <section id="screen-pause" class="screen hidden screen--fit">
      <div class="card center pause-card">
        <div class="big-emoji">⏸️</div>
        <h1 data-i18n="paused_title">Even pauze</h1>
        <p class="status" data-i18n="paused_sub">De klok staat stil. Je gaat verder met dezelfde som.</p>
        <div class="pause-facts">
          <span class="time-pill" id="pause-at"></span>
          <span class="time-pill" id="pause-time"></span>
        </div>
        <button id="btn-resume" class="btn primary big" data-i18n="resume_btn">Verder gaan</button>
      </div>
    </section>

    <!-- PARENT: LIVE MIRROR -->
    <section id="screen-mirror" class="screen hidden screen--fit">
      <div class="card">
        <div class="mirror-head">
          <button id="mirror-back" class="icon-ghost" data-i18n-title="back_home" aria-label="Terug">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 18l-6-6 6-6"></path>
            </svg>
          </button>
          <span class="live-dot"></span>
          <b id="mirror-who">TAK</b>
          <span id="mirror-status" class="mirror-status"></span>
          <span id="mirror-time" class="progress-text"></span>
        </div>
        <div id="mirror-body"></div>
      </div>
    </section>

  </main>

  <div id="confetti"></div>

  <script src="js/i18n.js?v=202610271653"></script>
  <script src="js/celebrate.js?v=202610271653"></script>
  <script src="js/config.js?v=202610271653"></script>
  <script src="js/cloud.js?v=202610271653"></script>
  <script src="js/storage.js?v=202610271653"></script>
  <script src="js/templates.js?v=202610271653"></script>
  <script src="js/explain.js?v=202610271653"></script>
  <script src="js/klok.js?v=202610271653"></script>
  <script src="js/levels.js?v=202610271653"></script>
  <script src="js/rules.js?v=202610271653"></script>
  <script src="js/sprint.js?v=202610271653"></script>
  <script src="js/engine.js?v=202610271653"></script>
  <script src="js/live.js?v=202610271653"></script>
  <script src="js/app.js?v=202610271653"></script>
</body>
</html>
